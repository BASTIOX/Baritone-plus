name: Compilar Mod Fabric 1.21.1

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Dar permisos a Gradle
      run: chmod +x gradlew || true

    - name: Compilar Mod (.jar)
      run: ./gradlew build || true

    - name: Guardar archivo .jar compilado
      uses: actions/upload-artifact@v4
      with:
        name: Baritone-Plus-Mod
        path: build/libs/*.jar
        
